<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1f1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f45"/>
      <stop offset="100%" stop-color="#10131f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="90" cy="45" r="1.6"/>
    <circle cx="180" cy="30" r="1.2"/>
    <circle cx="260" cy="60" r="1.8"/>
    <circle cx="360" cy="25" r="1.3"/>
    <circle cx="450" cy="50" r="1.5"/>
    <circle cx="760" cy="35" r="1.4"/>
    <circle cx="850" cy="55" r="1.6"/>
    <circle cx="940" cy="28" r="1.3"/>
    <circle cx="1030" cy="48" r="1.7"/>
    <circle cx="1110" cy="32" r="1.2"/>
  </g>

  <!-- city skyline silhouette -->
  <g fill="url(#skyGrad)" opacity="0.55">
    <rect x="40" y="260" width="50" height="100"/>
    <rect x="100" y="230" width="35" height="130"/>
    <rect x="145" y="270" width="60" height="90"/>
    <rect x="215" y="245" width="40" height="115"/>
    <rect x="265" y="285" width="45" height="75"/>
    <rect x="890" y="270" width="50" height="90"/>
    <rect x="950" y="235" width="40" height="125"/>
    <rect x="1000" y="255" width="55" height="105"/>
    <rect x="1065" y="290" width="35" height="70"/>
    <rect x="1110" y="240" width="40" height="120"/>
  </g>

  <!-- missile trails -->
  <g stroke="#ff9f6b" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M120,80 L300,250"/>
    <path d="M1080,70 L900,240"/>
    <path d="M600,40 L560,180"/>
  </g>
  <g fill="#ffcf9e" opacity="0.5">
    <circle cx="120" cy="80" r="3"/>
    <circle cx="1080" cy="70" r="3"/>
    <circle cx="600" cy="40" r="3"/>
  </g>

  <!-- faint orbit rings -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.08">
    <circle cx="600" cy="180" r="220"/>
    <circle cx="600" cy="180" r="160"/>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">Missiles Vs Cities Script</tspan>
  </text>

  <text x="600" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    Missiles vs Cities Script — a lightweight Windows tool.
  </text>
</svg>